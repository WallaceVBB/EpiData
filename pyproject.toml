[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "epidata"
version = "0.1.0"
description = "Application de traitement et d'enrichissement de donnees d'achats alimentaires"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
	"joblib==1.5.3",
	"numpy==2.5.1",
	"pandas==3.0.5",
	"rich==13.9.4",
	"scikit-learn==1.9.0",
	"PySide6==6.11.1",
	"pypdf==6.15.0",
	"pdfplumber==0.11.10",
	"openpyxl==3.1.5",
	"pytesseract==0.3.13",
	"requests",
	"packaging",
]

[project.optional-dependencies]
dev = [
	"pytest>=8",
	"ruff>=0.12",
]

[project.scripts]
epidata = "epidata.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["epidata*"]

[tool.setuptools.package-data]
epidata = [
	"resources/gui/*.ui",
	"resources/gui/*.qss",
	"resources/icons/*",
	"resources/parametres/*.csv",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".qtcreator", "benchmark_out", "tesseract"]

[tool.pyside6-project]
files = ["src/epidata/resources/gui/Historique_selecteur.ui", "src/epidata/resources/gui/A_propos.ui", "src/epidata/resources/gui/Accueil.ui", "src/epidata/resources/gui/ConvertisseurPDF_chargement.ui", "src/epidata/resources/gui/ConvertisseurPDF_resultats.ui", "src/epidata/resources/gui/ConvertisseurPDF_selecteur.ui", "src/epidata/resources/gui/Parametres.ui", "src/epidata/resources/gui/Traitement_chargement.ui", "src/epidata/resources/gui/Traitement_colonnes.ui", "src/epidata/resources/gui/Traitement_resultats.ui", "src/epidata/resources/gui/Traitement_selecteur.ui", "src/epidata/resources/gui/mainwindow.ui"]
