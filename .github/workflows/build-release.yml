name: Build & Release  
  
on:  
  push:  
    tags:  
      - "v*"  
  
jobs:  
  # ----------------- WINDOWS -----------------  
  build-windows:  
    runs-on: windows-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: actions/setup-python@v5  
        with:  
          python-version: "3.12"  
  
      - name: Installer les dépendances  
        run: |  
          python -m pip install --upgrade pip  
          pip install -r requirements.txt  
          pip install pyinstaller  
  
      - name: Build PyInstaller (onedir)  
        run: pyinstaller EpiData.spec  
  
      - name: Déterminer la version  
        shell: bash  
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Créer l'installeur Inno Setup
        run: |  
          choco install innosetup -y
          "%programfiles(x86)%\Inno Setup 6\ISCC.exe" packaging\EpiData.iss  
        shell: cmd
  
      - name: Upload artefact Windows  
        uses: actions/upload-artifact@v4  
        with:  
          name: windows-installer  
          path: packaging\Output\*.exe  
  
  # ----------------- LINUX -----------------  
  build-linux:  
    runs-on: ubuntu-latest  
    steps:  
      - uses: actions/checkout@v4  
  
      - uses: actions/setup-python@v5  
        with:  
          python-version: "3.12"  
  
      - name: Dépendances système (Qt/xcb)  
        run: |  
          sudo apt-get update  
          sudo apt-get install -y libxcb-cursor0 libegl1 libglib2.0-0 fuse  
  
      - name: Installer les dépendances Python  
        run: |  
          python -m pip install --upgrade pip  
          pip install -r requirements.txt  
          pip install pyinstaller  
  
      - name: Build PyInstaller (onedir)  
        run: pyinstaller EpiData.spec
        
      - name: Construire l'AppImage  
        run: bash packaging/make_appimage.sh  
        env:  
          APP_VERSION: ${{ github.ref_name }}
  
      - name: Upload artefact Linux  
        uses: actions/upload-artifact@v4  
        with:  
          name: linux-appimage  
          path: "*.AppImage"  
  
  # ----------------- PUBLICATION -----------------  
  release:  
    needs: [build-windows, build-linux]  
    runs-on: ubuntu-latest  
    permissions:  
      contents: write  
    steps:  
      - uses: actions/download-artifact@v4  
        with:  
          path: artefacts  
  
      - name: Créer / mettre à jour la release  
        uses: softprops/action-gh-release@v2  
        with:  
          files: |  
            artefacts/windows-installer/*.exe  
            artefacts/linux-appimage/*.AppImage